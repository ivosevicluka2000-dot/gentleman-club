
<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gentlemen’s Club Serbia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@100;200;300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c5a059;
            --black: #050505;
            --dark: #0a0a0a;
        }
        html {
            overflow-x: hidden;
            overflow-y: auto;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--black);
            color: #ffffff;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        #root {
            transform: scale(0.60);
            transform-origin: top left;
            width: 166.67%;
            min-height: 166.67vh;
        }
        h1, h2, h3, h4, .serif {
            font-family: 'Cormorant Garamond', serif;
        }
        .luxury-text-gradient {
            background: linear-gradient(to right, #ffffff 0%, #a1a1a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-accent {
            color: var(--gold);
        }
        .gold-border {
            border-color: rgba(197, 160, 89, 0.2);
        }
        .hover-gold:hover {
            color: var(--gold);
            border-color: var(--gold);
        }
        .section-divider {
            width: 1px;
            height: 100px;
            background: linear-gradient(to bottom, var(--gold), transparent);
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--black);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold);
        }
    </style>
